<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arjun S Nair — UI/UX Designer</title>

  <!-- Typography close to the reference -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">

    <header class="topbar">
      <div>Visual Designer</div>
      <div class="role"></div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme"
        title="Toggle night mode">
        <img class="moon-icon" src="assets/moon.svg" alt="" aria-hidden="true">
      </button>
    </header>

    <div class="hero-name" aria-hidden="true">
      <span id="heroTitle">Arjun S Nair</span>
    </div>

    <section class="bento">

      <a class="card about" href="#about" aria-label="About" data-title="About">
        <span class="card-label">About</span>
        <span class="arrow">↗</span>
      </a>

      <a class="card portfolio" href="#portfolio" aria-label="Portfolio" data-title="Portfolio">
        <span class="card-label">Portfolio</span>
        <span class="arrow">↗</span>
      </a>

      <a class="card contact" href="mailto:hello@example.com" aria-label="Contact" data-title="Contact">
        <span class="card-label">Contact</span>
        <span class="arrow">↗</span>
      </a>

      <a class="card portrait" href="#about" aria-label="Me" data-title="Me">
        <img src="assets/me.png" alt="Profile portrait">
      </a>

      <div class="tools">
        <a class="tool-card" href="#tools" aria-label="Tools" data-title="Tools">
          <div class="tools-icons" aria-hidden="true">
            <div class="tools-icon-track">
              <div class="tools-icon-group">
                <img src="assets/illustrator.png" alt="" draggable="false">
                <img src="assets/figma.png" alt="" draggable="false">
                <img src="assets/framer.png" alt="" draggable="false">
                <img src="assets/photoshop.png" alt="" draggable="false">
                <img src="assets/stitch.png" alt="" draggable="false">
                <img src="assets/antigravity.png" alt="" draggable="false">
              </div>
            </div>
          </div>

          <a class="resume" href="resume.pdf" target="_blank" aria-label="Resume" data-title="Resume">
            <span class="card-label">Resume</span>
            <span class="arrow">↗</span>
          </a>
      </div>

    </section>

    <!-- Hidden anchor targets for your future sections -->
    <div id="about"></div>
    <div id="portfolio"></div>
    <div id="tools"></div>

  </main>


  <script>
    const themeToggle = document.getElementById("themeToggle");
    const moonIcon = document.querySelector(".moon-icon");

    // Light theme is the default.
    document.body.classList.remove("dark");

    // Clicking the actual .moon-icon switches between light and dark mode.
    moonIcon.addEventListener("click", (event) => {
      event.stopPropagation();

      const dark = document.body.classList.toggle("dark");

      themeToggle.setAttribute(
        "aria-label",
        dark ? "Switch to light theme" : "Switch to dark theme"
      );

      themeToggle.setAttribute(
        "title",
        dark ? "Switch to light theme" : "Switch to night mode"
      );
    });

    const heroTitle = document.getElementById("heroTitle");
    const interactiveCards = document.querySelectorAll(
      ".about, .portfolio, .contact, .portrait, .tool-card, .resume"
    );

    const defaultTitle = "Arjun S Nair";
    let currentTitle = defaultTitle;
    let transitionTimer;

    function setHeroTitle(title) {
      const nextTitle = title || defaultTitle;

      if (nextTitle === currentTitle) return;
      currentTitle = nextTitle;

      // Interrupt the previous transition cleanly when the pointer
      // moves directly from one card to another.
      clearTimeout(transitionTimer);

      heroTitle.closest(".hero-name").classList.add("is-changing");

      transitionTimer = setTimeout(() => {
        heroTitle.textContent = nextTitle;

        // Let the new word settle naturally.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            heroTitle.closest(".hero-name").classList.remove("is-changing");
          });
        });
      }, 150);
    }

    interactiveCards.forEach(card => {
      const title = card.dataset.title;

      card.addEventListener("mouseenter", () => setHeroTitle(title));
      card.addEventListener("mouseleave", () => setHeroTitle(defaultTitle));

      card.addEventListener("focus", () => setHeroTitle(title));
      card.addEventListener("blur", () => setHeroTitle(defaultTitle));

      card.addEventListener("click", () => {
        card.style.transform = "scale(.985)";
        setTimeout(() => card.style.transform = "", 140);
      });
    });
  </script>
</body>

</html>
