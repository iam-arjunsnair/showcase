<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arjun S Nair — UI/UX Designer</title>

  <!-- Typography close to the reference -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #f8f8f6;
      --card: rgba(211, 211, 211, .76);
      --card-hover: rgba(220, 220, 220, .84);
      --text: #0b0b0b;
      --muted: #5f5f5f;
      --border: rgba(25, 25, 25, .30);
      --glass-highlight: rgba(255, 255, 255, .34);
      --radius: 29px;
      --gap: 16px;
    }

    body.dark {
      --bg: #050505;
      --card: rgba(24, 24, 24, .88);
      --card-hover: rgba(28, 28, 28, .94);
      --text: #f7f7f7;
      --muted: #b8b8b8;
      --border: rgba(255, 255, 255, .30);
      --glass-highlight: rgba(255, 255, 255, .08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      transition: background .6s ease, color .6s ease;
      font-family: "Source Serif 4", "Source Serif Pro", Georgia, serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 44px 27px 28px;
      position: relative;
    }

    /* Header */
    .topbar {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      padding: 0 0 0;
      font-size: 18px;
      font-weight: 600;
    }

    .topbar .role {
      text-align: center;
    }

    .topbar .status {
      text-align: right;
      opacity: .0;
      /* reserved for future navigation */
    }

    /* Oversized name behind the cards */
    .hero-name {
      position: absolute;
      z-index: 0;
      top: 105px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      white-space: nowrap;
      font-size: clamp(112px, 13.2vw, 205px);
      line-height: .72;
      letter-spacing: -0.065em;
      font-weight: 400;
      font-family: "Amita", cursive;
      color: var(--text);
      text-shadow: 0 1px 1px rgba(0, 0, 0, .04);
      pointer-events: none;
      user-select: none;
    }

    .hero-name span {
      display: inline-block;
      min-width: 1ch;
      will-change: opacity, transform, filter;
      transition:
        opacity .38s cubic-bezier(.22, .61, .36, 1),
        transform .55s cubic-bezier(.22, .61, .36, 1),
        filter .38s ease;
    }

    .hero-name.is-changing span {
      opacity: .82;
      transform: translateY(3px) scale(.985);
      filter: blur(.35px);
    }

    /* Main bento grid */
    .bento {
      position: relative;
      z-index: 2;
      margin-top: 126px;
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 1.04fr .92fr;
      grid-template-rows: 336px 340px;
      gap: var(--gap);
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      backdrop-filter: blur(18px) saturate(115%);
      transition:
        transform .45s cubic-bezier(.2, .8, .2, 1),
        background .35s ease,
        border-color .35s ease;
      isolation: isolate;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: var(--text);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(145deg,
          rgba(255, 255, 255, .22),
          rgba(255, 255, 255, .035) 48%,
          transparent 78%);
      z-index: -1;
    }

    body.dark .card::after {
      background: linear-gradient(145deg,
          rgba(255, 255, 255, .07),
          transparent 55%);
    }

    body.dark .card {
      background: rgba(24, 24, 24, .88);
    }

    body.dark .card:hover {
      background: rgba(28, 28, 28, .94);
    }

    /* Layout */
    .about {
      grid-column: 1;
      grid-row: 1;
    }

    .portfolio {
      grid-column: 2 / 5;
      grid-row: 1;
    }

    .contact {
      grid-column: 1 / 3;
      grid-row: 2;
    }

    .portrait {
      grid-column: 3;
      grid-row: 2;
      background: var(--card);
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      backdrop-filter: blur(18px) saturate(115%);
    }

    .tools {
      grid-column: 4;
      grid-row: 2;
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: var(--gap);
      background: transparent;
      border: 0;
      overflow: visible;
    }

    .tools .tool-card,
    .tools .resume {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      backdrop-filter: blur(18px) saturate(115%);
      position: relative;
      overflow: hidden;
      transition: transform .45s cubic-bezier(.2, .8, .2, 1), border-color .35s ease;
    }

    body.dark .tools .tool-card,
    body.dark .tools .resume {
      background: rgba(24, 24, 24, .88);
    }

    .tools .tool-card:hover,
    .tools .resume:hover {
      transform: translateY(-4px);
      border-color: var(--text);
    }

    .tools .tool-card::before,
    .tools .resume::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(145deg,
          rgba(255, 255, 255, .30),
          rgba(255, 255, 255, .06) 48%,
          transparent);
      z-index: 1;
    }

    body.dark .tools .tool-card::before,
    body.dark .tools .resume::before {
      background: linear-gradient(145deg,
          rgba(255, 255, 255, .08),
          transparent 48%);
    }

    .card-label {
      position: absolute;
      left: 43px;
      bottom: 21px;
      font-size: 27px;
      line-height: 1;
      font-weight: 600;
      z-index: 4;
    }

    .arrow {
      position: absolute;
      right: 43px;
      bottom: 21px;
      font-family: Arial, sans-serif;
      font-size: 29px;
      line-height: 1;
      font-weight: 300;
      z-index: 4;
      transition: transform .3s ease;
    }

    .card:hover .arrow,
    .tool-card:hover .arrow,
    .resume:hover .arrow {
      transform: translate(4px, -4px);
    }

    /* The blur is produced naturally by backdrop-filter.
     The oversized title stays behind the glass, so only the
     portion covered by a card becomes blurred. */

    .portfolio::before {
      font-size: 105px;
      left: 46%;
    }


    /* Theme toggle — moon button */
    .theme-toggle {
      justify-self: end;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
      z-index: 20;
      transition: transform .35s ease, color .35s ease;
    }

    .theme-toggle:hover {
      transform: rotate(-12deg) scale(1.08);
    }

    .moon-icon {
      width: 25px;
      height: 25px;
      display: block;
      object-fit: contain;
      transition:
        transform .55s cubic-bezier(.22, .61, .36, 1),
        opacity .35s ease;
    }

    body.dark .moon-icon {
      transform: rotate(18deg);
      filter: brightness(0) invert(1);
    }

    /* Automatically scrolling design-tool logos */
    .logo-marquee {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent 0, black 12%, black 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0, black 12%, black 88%, transparent 100%);
    }

    .logo-track {
      display: flex;
      width: max-content;
      align-items: center;
      gap: 18px;
      padding-left: 18px;
      animation: logoScroll 28s linear infinite;
    }

    .logo-marquee:hover .logo-track {
      animation-play-state: paused;
    }

    .logo-pill {
      flex: 0 0 auto;
      height: 54px;
      min-width: 54px;
      padding: 4px;
      border: 0;
      border-radius: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: none;
    }

    body.dark .logo-pill {
      background: transparent;
    }

    .logo-pill b {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .logo-pill span {
      display: none;
    }

    .logo-pill.figma b {
      background: #f24e1e;
      color: #fff;
    }

    .logo-pill.claude b {
      background: #d97757;
      color: #fff;
    }

    .logo-pill.illustrator b {
      background: #ff9a00;
      color: #160d00;
    }

    .logo-pill.photoshop b {
      background: #31a8ff;
      color: #06131f;
    }

    .logo-pill.stitch b {
      background: #111;
      color: #fff;
    }

    .logo-pill.flow b {
      background: #4285f4;
      color: #fff;
    }

    .logo-pill.framer b {
      background: #0055ff;
      color: #fff;
    }

    .logo-pill.replit b {
      background: #f26207;
      color: #fff;
    }

    .logo-pill.lovable b {
      background: #ff4f81;
      color: #fff;
    }

    @keyframes logoScroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-track {
        animation: none;
      }
    }


    /* Infinite tools marquee — six icons, duplicated for a seamless loop */
    .tools-icons {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 0;
    }

    .tools-icon-track {
      display: flex;
      width: max-content;
      align-items: center;
      animation: toolsIconScroll 16s linear infinite;
      will-change: transform;
    }

    .tools-icon-group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
    }

    .tools-icons img {
      display: block;
      width: 64px;
      height: 64px;
      min-width: 64px;
      max-width: 64px;
      object-fit: cover;
      object-position: center;
      border-radius: 14px;
      flex: 0 0 64px;
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes toolsIconScroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .tools-icons:hover .tools-icon-track {
      animation-play-state: paused;
    }

    @media (max-width: 680px) {
      .tools-icon-group {
        gap: 12px;
        padding: 0 12px;
      }

      .tools-icons img {
        width: 58px;
        height: 58px;
        min-width: 58px;
        max-width: 58px;
        flex-basis: 58px;
        border-radius: 12px;
      }
    }

    /* Portrait */
    .portrait img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(.52) contrast(1.08) saturate(.72);
      transform: scale(1.01);
      transition: transform .8s cubic-bezier(.2, .8, .2, 1), filter .5s ease;
    }

    .portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .22), rgba(0, 0, 0, .55)),
        radial-gradient(circle at 50% 50%, transparent 20%, rgba(0, 0, 0, .42) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .portrait:hover img {
      transform: scale(1.055);
      filter: brightness(.62) contrast(1.08) saturate(.8);
    }


    .resume .card-label {
      left: 45px;
    }

    /* Small entrance animation */
    .card {
      opacity: 0;
      animation: reveal .75s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    .about {
      animation-delay: .05s;
    }

    .portfolio {
      animation-delay: .12s;
    }

    .contact {
      animation-delay: .19s;
    }

    .portrait {
      animation-delay: .26s;
    }

    .tools {
      animation-delay: .33s;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* In browsers without backdrop-filter, retain a translucent glass surface. */
    @supports not ((backdrop-filter: blur(18px))) {

      .card,
      .tools .tool-card,
      .tools .resume {
        background: rgba(25, 25, 25, 0.78);
      }
    }

    /* Tablet */
    @media (max-width: 1050px) {
      .page {
        padding: 34px 20px 22px;
      }

      .bento {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 270px 270px 270px;
        margin-top: 110px;
      }

      .about {
        grid-column: 1;
        grid-row: 1;
      }

      .portfolio {
        grid-column: 2;
        grid-row: 1;
      }

      .contact {
        grid-column: 1 / 3;
        grid-row: 2;
      }

      .portrait {
        grid-column: 1;
        grid-row: 3;
      }

      .tools {
        grid-column: 2;
        grid-row: 3;
      }
    }

    /* Mobile */
    @media (max-width: 680px) {
      .page {
        padding: 25px 14px 16px;
      }

      .topbar {
        grid-template-columns: 1fr auto auto;
        font-size: 16px;
      }

      .topbar .role {
        text-align: right;
      }

      .hero-name {
        top: 96px;
        font-size: 25vw;
        line-height: .8;
      }

      .bento {
        margin-top: 105px;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(5, 240px);
        gap: 12px;
      }

      .about,
      .portfolio,
      .contact,
      .portrait,
      .tools {
        grid-column: 1;
      }

      .about {
        grid-row: 1;
      }

      .portfolio {
        grid-row: 2;
      }

      .contact {
        grid-row: 3;
      }

      .portrait {
        grid-row: 4;
      }

      .tools {
        grid-row: 5;
      }

      .card-label {
        left: 27px;
        bottom: 19px;
        font-size: 23px;
      }

      .arrow {
        right: 27px;
        bottom: 18px;
        font-size: 25px;
      }

      .tools {
        min-height: 240px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .card,
      .tools .tool-card,
      .tools .resume {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="topbar">
      <div>Arjun S Nair</div>
      <div class="role">UI/UX Designer</div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme"
        title="Toggle night mode">
        <img class="moon-icon" src="assets/moon.svg" alt="" aria-hidden="true">
      </button>
    </header>

    <div class="hero-name" aria-hidden="true">
      <span id="heroTitle">Arjun S Nair</span>
    </div>

    <section class="bento">

      <a class="card about" href="#about" aria-label="About" data-title="About">
        <span class="card-label">About</span>
        <span class="arrow">↗</span>
      </a>

      <a class="card portfolio" href="#portfolio" aria-label="Portfolio" data-title="Portfolio">
        <span class="card-label">Portfolio</span>
        <span class="arrow">↗</span>
      </a>

      <a class="card contact" href="mailto:hello@example.com" aria-label="Contact" data-title="Contact">
        <span class="card-label">Contact</span>
        <span class="arrow">↗</span>
      </a>

      <a class="card portrait" href="#about" aria-label="Me" data-title="Me">
        <img src="assets/me.png" alt="Profile portrait">
      </a>

      <div class="tools">
        <a class="tool-card" href="#tools" aria-label="Tools" data-title="Tools">
          <div class="tools-icons" aria-hidden="true">
            <div class="tools-icon-track">
              <div class="tools-icon-group">
                <img src="assets/illustrator.svg" alt="" draggable="false"><img src="assets/figma.svg" alt=""
                  draggable="false">
                <img src="assets/claude.svg" alt="" draggable="false"><img src="assets/photoshop.svg" alt=""
                  draggable="false">
                <img src="assets/stitch.svg" alt="" draggable="false"><img src="assets/google-flow.svg" alt=""
                  draggable="false">
              </div>
              <div class="tools-icon-group"><img src="assets/tool-icon.svg" alt="" draggable="false"><img
                  src="assets/tool-icon.svg" alt="" draggable="false"><img src="assets/tool-icon.svg" alt=""
                  draggable="false"><img src="assets/tool-icon.svg" alt="" draggable="false"><img
                  src="assets/tool-icon.svg" alt="" draggable="false"><img src="assets/tool-icon.svg" alt=""
                  draggable="false"></div>
            </div>
          </div>

          <a class="resume" href="resume.pdf" target="_blank" aria-label="Resume" data-title="Resume">
            <span class="card-label">Resume</span>
            <span class="arrow">↗</span>
          </a>
      </div>

    </section>

    <!-- Hidden anchor targets for your future sections -->
    <div id="about"></div>
    <div id="portfolio"></div>
    <div id="tools"></div>

  </main>


  <script>
    const themeToggle = document.getElementById("themeToggle");
    const moonIcon = document.querySelector(".moon-icon");

    // Light theme is the default.
    document.body.classList.remove("dark");

    // Clicking the actual .moon-icon switches between light and dark mode.
    moonIcon.addEventListener("click", (event) => {
      event.stopPropagation();

      const dark = document.body.classList.toggle("dark");

      themeToggle.setAttribute(
        "aria-label",
        dark ? "Switch to light theme" : "Switch to dark theme"
      );

      themeToggle.setAttribute(
        "title",
        dark ? "Switch to light theme" : "Switch to night mode"
      );
    });

    const heroTitle = document.getElementById("heroTitle");
    const interactiveCards = document.querySelectorAll(
      ".about, .portfolio, .contact, .portrait, .tool-card, .resume"
    );

    const defaultTitle = "Arjun S Nair";
    let currentTitle = defaultTitle;
    let transitionTimer;

    function setHeroTitle(title) {
      const nextTitle = title || defaultTitle;

      if (nextTitle === currentTitle) return;
      currentTitle = nextTitle;

      // Interrupt the previous transition cleanly when the pointer
      // moves directly from one card to another.
      clearTimeout(transitionTimer);

      heroTitle.closest(".hero-name").classList.add("is-changing");

      transitionTimer = setTimeout(() => {
        heroTitle.textContent = nextTitle;

        // Let the new word settle naturally.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            heroTitle.closest(".hero-name").classList.remove("is-changing");
          });
        });
      }, 150);
    }

    interactiveCards.forEach(card => {
      const title = card.dataset.title;

      card.addEventListener("mouseenter", () => setHeroTitle(title));
      card.addEventListener("mouseleave", () => setHeroTitle(defaultTitle));

      card.addEventListener("focus", () => setHeroTitle(title));
      card.addEventListener("blur", () => setHeroTitle(defaultTitle));

      card.addEventListener("click", () => {
        card.style.transform = "scale(.985)";
        setTimeout(() => card.style.transform = "", 140);
      });
    });
  </script>
</body>

</html>
